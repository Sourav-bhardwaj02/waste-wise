services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wastewise-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - wisenet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wastewise-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - backend2
    restart: always
    networks:
      - wisenet

  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    container_name: wastewise-backend2
    ports:
      - "8000:8000"
    restart: always
    networks:
      - wisenet

  frontend2:
    build:
      context: ./frontend2
      dockerfile: Dockerfile
    container_name: wastewise-frontend2
    ports:
      - "5174:80"
    depends_on:
      - backend
      - backend2
    restart: always
    networks:
      - wisenet

networks:
  wisenet:
    driver: bridge
